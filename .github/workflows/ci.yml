name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Lint + Tests (Linux) ───────────────────────────────────────────────
  test:
    name: Lint + Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (tls only)
        run: cargo clippy --all-targets --no-default-features --features tls -- -D warnings

      # The shipping feature set: `ffi` (which brings `coordinator` + `utls`) is
      # what iOS/Android link, and the two sub-crates (construct-veil-protocol,
      # construct-veil-relay) are what the deployed relay is built from.
      - name: Clippy (workspace, all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Run tests (default)
        run: cargo test

      - name: Run tests (workspace, all features)
        run: cargo test --workspace --all-features

  # ── 1b. Dependency advisories ─────────────────────────────────────────────
  # cargo-audit against Cargo.lock; ignores live in .cargo/audit.toml with the
  # reason for each. A vulnerability fails the job, an "unmaintained"/"yanked"
  # warning does not. Added 2026-10-22: rustls sat on 0.23.37 with five
  # advisories (one a PQ key-exchange downgrade) and h2 on a DoS for weeks.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  # ── 2. macOS FFI build (matches iOS platform SDK) ────────────────────────
  build-macos:
    name: macOS FFI Build
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      # Validate the FFI compiles for host (macOS) and iOS targets.
      # cargo check validates the dependency graph without linking — fast.
      - name: Check ffi (macOS host)
        run: cargo check --features ffi

      - name: Check ffi (iOS device)
        run: cargo check --features ffi --target aarch64-apple-ios

      - name: Check ffi (iOS simulator)
        run: cargo check --features ffi --target aarch64-apple-ios-sim
