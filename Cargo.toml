[workspace]
members = [
    ".",
    "crates/construct-veil-protocol",
    "crates/construct-veil-relay",
]
resolver = "2"

[workspace.package]
version = "3.5.0"
authors = ["Construct Team"]
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/construct-msg/construct-veil"

[package]
name = "construct-veil"
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
description = "VEIL — (Variable Encoded Interface Layer) — traffic obfuscation transport for Construct messenger"
keywords = ["pluggable-transport", "censorship-resistance", "tls"]

[lib]
name = "construct_veil"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Shared veil-front protocol types (tickets, auth, framing)
construct-veil-protocol = { path = "crates/construct-veil-protocol" }

# Crypto
sha2 = "0.10"
rand_chacha = "0.3"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = "2"

# Async I/O
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "sync", "time"] }
bytes = "1.6"

# Error handling
thiserror = "1"

[dependencies.tracing]
version = "0.1"
optional = true

# VEIL Coordinator — FSM-based obfuscator selection with happy-eyeballs probing
# Requires the "coordinator" feature flag (brings in sqlite + async-trait)
[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"]
optional = true

[dependencies.async-trait]
version = "0.1"
optional = true

[dependencies.tokio-util]
version = "0.7"
features = ["codec", "compat"]
optional = true

[dependencies.bitflags]
version = "2"
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# Self-signed certs for the in-memory key-exchange tests (tls_pinned.rs).
rcgen = "0.13"
# Used only by the ignored live veil-front gRPC round-trip diagnostic test.
h2 = "0.4"
http = "1"

[features]
default = []
# Enable VEIL Coordinator — FSM-based obfuscator selection with happy-eyeballs
# probing, per-network scoring, and persistent state.
coordinator = [
  "dep:sqlx", "dep:async-trait", "dep:tokio-util", "dep:bitflags", "dep:tracing",
  "utls",
]
# C FFI for the iOS and Android apps (veil_start, veil_front_ferry_fd, …).
ffi = ["coordinator"]
# rustls with a custom SPKI-pinning verifier for full SNI and cert control.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:x509-cert"]
# uTLS browser fingerprint mimicry (Chrome 131, Firefox 128, Safari 18 profiles).
# Implies tls. Adds md-5 for JA3 hash computation.
utls = ["tls", "dep:md-5"]

[dependencies.rustls]
version = "0.23"
# aws_lc_rs + prefer-post-quantum: the hybrid X25519MLKEM768 key exchange the TLS
# profiles offer first (tls_fingerprint.rs). ring has no ML-KEM; it stays enabled for
# callers that name it.
features = ["ring", "aws_lc_rs", "prefer-post-quantum"]
optional = true

[dependencies.tokio-rustls]
version = "0.26"
optional = true

[dependencies.rustls-pki-types]
version = "1"
optional = true

[dependencies.x509-cert]
version = "0.2"
default-features = false
features = ["std"]
optional = true

[dependencies.md-5]
version = "0.10"
optional = true

[profile.release]
opt-level = 3
lto = true
