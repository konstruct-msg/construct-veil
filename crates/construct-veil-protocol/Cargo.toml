[package]
name = "construct-veil-protocol"
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
description = "Shared wire protocol types for veil-front: tickets, auth records, frame codec"

[dependencies]
bytes = "1.6"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
# Ed25519 for backend-signed capabilities (issuer sign + relay verify, ticket B2).
ed25519-dalek = "2"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1"
tokio-util = { version = "0.7", features = ["codec"] }
# AUTH v4 blind tokens: RFC 9474 RSABSSA-SHA384-PSS-Randomized (token module, todo 311).
blind-rsa-signatures = { version = "=0.18.0", default-features = false }
# TEMPORARY: blind-rsa-signatures 0.18.0 does not build against rsa 0.10.0 (its `pbrsa`
# module, which we do not use, targets the 0.10.0-rc trait shapes). Remove this pin once a
# release builds against rsa >= 0.10.0; `cargo audit` flags rc.18 (RUSTSEC-2023-0071 lists
# `>= 0.10.0` as patched) until then. Only the issuer's blind_sign uses the private key.
rsa = { version = "=0.10.0-rc.18", default-features = false }
# rc.18 does not build against pkcs1 0.8.0 either; same end condition as the rsa pin.
pkcs1 = { version = "=0.8.0-rc.4", default-features = false }

[features]
rand = ["dep:rand"]

[dependencies.rand]
version = "0.8"
optional = true

[dev-dependencies]
hex = "0.4"
proptest = "1.4"
rand = "0.8"
rand_chacha = "0.3"
